# Checks every pull request, every change on main and every claude/ branch: scripts parse, JARVIS Core's tests
# pass, and the update package still builds under the size limit. The mac job does the same on a Mac with an Apple
# chip (like the owner's Mac mini), builds the Mac app and starts it once.
name: Tests

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every script parses
        run: |
          fail=0
          for f in $(git ls-files -- '*.js' '*.cjs' '*.mjs' | grep -E '^(src|dist/assets|scripts|tests)/'); do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - name: JARVIS Core tests
        working-directory: tests/core
        run: npm install && npm test

      - name: The update package builds
        run: node scripts/release/build-update.mjs

  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App tests on macOS
        run: node --experimental-vm-modules --test tests/frontend/*.test.mjs

      - name: JARVIS Core tests on macOS
        working-directory: tests/core
        run: npm install && npm test

      - name: Build the Mac app
        run: npm install --no-audit --no-fund && node scripts/release/build-mac.mjs

      - name: Start the Mac app
        run: node tests/mac/smoke.mjs

      - name: Keep the Mac app to try out
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-mac
          path: release/JARVIS-Armor-Workspace-*-mac.zip
          retention-days: 14
