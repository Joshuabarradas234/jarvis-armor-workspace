# Checks every pull request, every change on main and every claude/ branch: scripts parse, JARVIS Core's tests
# pass, and the update package still builds under the size limit. The mac job does the same on a Mac with an Apple
# chip (like the owner's Mac mini), builds the Mac app and starts it once.
name: Tests

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every script parses
        run: |
          fail=0
          for f in $(git ls-files -- '*.js' '*.cjs' '*.mjs' | grep -E '^(src|dist/assets|scripts|tests)/'); do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - name: JARVIS Core tests
        working-directory: tests/core
        run: npm install && npm test

      - name: The update package builds
        run: node scripts/release/build-update.mjs

      - name: JARVIS Server tests
        run: node tests/server/server.test.mjs

      - name: The JARVIS Server package builds
        run: node scripts/release/build-server.mjs

  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: App tests on macOS
        run: node tests/ci-annotate.mjs node --experimental-vm-modules --test --test-reporter=tap tests/frontend/*.test.mjs

      - name: JARVIS Core tests on macOS
        if: always()
        working-directory: tests/core
        run: npm install && node ../ci-annotate.mjs node core.test.mjs

      - name: JARVIS Server tests on macOS
        if: always()
        run: node tests/ci-annotate.mjs node tests/server/server.test.mjs

      - name: Build the Mac app
        if: always()
        run: npm install --no-audit --no-fund && node tests/ci-annotate.mjs node scripts/release/build-mac.mjs

      - name: Start the Mac app
        if: always()
        run: node tests/ci-annotate.mjs node tests/mac/smoke.mjs

      - name: One-click Mac update
        if: always()
        run: node tests/ci-annotate.mjs node tests/mac/update.mjs

      - name: Keep the Mac app to try out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-mac
          path: release/JARVIS-Armor-Workspace-*-mac-*.dmg
          retention-days: 14

  server-intel:
    # JARVIS Server on an Intel Mac with Node 22, like the owner's Mac mini (Late 2014, macOS 12): the tests, the
    # package, and a real install through the Install .command, then Uninstall.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The Mac scripts parse
        run: for f in scripts/server/*.command tests/mac/server-install.sh; do bash -n "$f" || exit 1; done

      - name: JARVIS Server tests on an Intel Mac
        run: node tests/ci-annotate.mjs node tests/server/server.test.mjs

      - name: Build the Mac app for Intel (Electron 43, opens on macOS 12)
        if: always()
        run: npm install --no-audit --no-fund && node tests/ci-annotate.mjs node scripts/release/build-mac.mjs --arch x64

      - name: Start the Mac app on an Intel Mac
        if: always()
        run: node tests/ci-annotate.mjs node tests/mac/smoke.mjs

      - name: One-click Mac update
        if: always()
        run: node tests/ci-annotate.mjs node tests/mac/update.mjs

      - name: Pack JARVIS Server
        if: always()
        run: node scripts/release/build-server.mjs

      - name: Install it as the owner does
        if: always()
        run: node tests/ci-annotate.mjs bash tests/mac/server-install.sh

      - name: Keep the server package to try out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Server-mac
          path: release/JARVIS-Server-*-mac.zip
          retention-days: 14
