<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS // Standby</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 66% 50%,#0b223055,transparent 52%),#050b10;color:#829ca9;font-family:'Segoe UI',system-ui,sans-serif}canvas{position:absolute;inset:0}.title{position:absolute;left:29%;top:44%;font-weight:200}.title small{font:8px Consolas,monospace;letter-spacing:.17em;color:#456775}h1{font-size:30px;letter-spacing:.23em;font-weight:200;margin:25px 0}p{font:9px Consolas,monospace;letter-spacing:.16em;color:#466b7e}.clock{position:absolute;right:6%;bottom:9%;text-align:right}.clock strong{display:block;font-size:38px;font-weight:200}.clock span{display:block;margin-top:13px;font:9px Consolas,monospace;color:#436675}.corner{position:absolute;bottom:9%;left:6%;font:8px Consolas,monospace;letter-spacing:.14em;color:#354f60}</style></head><body><canvas></canvas><div class="title"><small>PERSONAL OPERATING ENVIRONMENT</small><h1>JARVIS</h1><p>· SYSTEM STANDBY</p></div><div class="clock"><strong></strong><span></span></div><div class="corner">ARMOR WORKSPACE / READY ON YOUR COMMAND</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let phase=0,paused=false,battery=false;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}addEventListener('resize',resize);resize();
function frame(){setTimeout(frame,battery?200:100);if(paused||document.hidden)return;phase+=.0015;const w=canvas.width,h=canvas.height,x=w*.67,y=h*.49,r=Math.min(w*.15,h*.23);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#75b6cf07';ctx.lineWidth=1;for(let n=0;n<w;n+=70){ctx.beginPath();ctx.moveTo(n,0);ctx.lineTo(n,h);ctx.stroke();}for(let n=0;n<h;n+=70){ctx.beginPath();ctx.moveTo(0,n);ctx.lineTo(w,n);ctx.stroke();}ctx.save();ctx.translate(x,y);for(let ring=0;ring<4;ring++){ctx.beginPath();ctx.strokeStyle=['#87d0e92c','#82cfe93c','#74bdde24','#6fbed432'][ring];ctx.lineWidth=ring===1?2:1;const radius=r*(1-ring*.17);ctx.setLineDash(ring===1?[radius*.8,radius*.3]:ring===2?[2,8]:[]);ctx.arc(0,0,radius,phase*(ring%2?-1:1),Math.PI*2+phase*(ring%2?-1:1));ctx.stroke();}ctx.setLineDash([]);ctx.strokeStyle='#9cdae344';ctx.beginPath();for(let i=0;i<7;i++){const a=i*Math.PI/3;const px=Math.sin(a)*r*.30,py=Math.cos(a)*r*.30;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();ctx.font=Math.round(r*.24)+'px Segoe UI';ctx.fillStyle='#99d2df66';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('J',0,0);ctx.restore();}
setInterval(()=>{document.querySelector('.clock strong').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});document.querySelector('.clock span').textContent=new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});},1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{battery=!b.charging;b.addEventListener('chargingchange',()=>battery=!b.charging);});
function livelyWallpaperPlaybackChanged(data){try{paused=JSON.parse(data).IsPaused;}catch{}}
frame();</script></body></html>
