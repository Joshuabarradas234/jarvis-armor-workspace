<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' jarvis:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' jarvis: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>JARVIS · Hand control</title>
<style>
html,body{margin:0;width:96px;height:96px;background:transparent;overflow:hidden}
svg{width:96px;height:96px;display:block;filter:drop-shadow(0 0 6px #7fd6e8);transition:opacity .25s}
.halo{fill:none;stroke:#7fd6e888;stroke-width:1.5}
.track{fill:#7fd6e814;stroke:#7fd6e8;stroke-width:2.5;transition:fill .15s,stroke-width .15s}
.arc{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:48px 48px;opacity:0}
.dot{fill:#e8fbff}
.hold .arc{opacity:1}
.grab .track{fill:#7fd6e870;stroke-width:4}.grab .halo{stroke:#fff}
.away svg{opacity:.18}
[data-flash=miss] .track,[data-flash=denied] .track{stroke:#ff8a7a;animation:shake .35s}
[data-flash=thrown] .halo,[data-flash=grabbed] .halo{animation:burst .6s ease-out}
@keyframes burst{from{stroke-width:6;stroke:#fff}to{stroke-width:1.5}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
</style>
<script type="module" src="./assets/desk-hands.js"></script>
</head><body>
<svg viewBox="0 0 96 96" aria-hidden="true"><circle class="halo" cx="48" cy="48" r="32"/><circle class="track" cx="48" cy="48" r="22"/><circle class="arc" cx="48" cy="48" r="22" pathLength="100"/><circle class="dot" cx="48" cy="48" r="4"/></svg>
</body></html>
